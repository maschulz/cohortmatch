name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-python@v7
      with:
        python-version: '3.12'
        cache: 'pip'
    - name: Install
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Ruff lint
      run: ruff check .
    - name: Ruff format
      run: ruff format --check .
    - name: mypy (non-blocking)
      run: mypy cohortmatch
      continue-on-error: true

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,viz]"

    - name: Run tests with coverage
      run: pytest --cov-report=xml

    - name: Upload coverage report
      if: always()
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

    - name: Upload test artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-results-${{ matrix.python-version }}
        path: |
          coverage.xml
          .coverage
        retention-days: 7

  # The lower bounds in pyproject are a claim nothing else checks: the matrix
  # above always installs the latest of everything. Install the exact floors
  # and run the suite.
  test-min-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.10
      uses: actions/setup-python@v7
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install minimum declared dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" \
          "numpy==1.21.2" "pandas==1.3.3" "scipy==1.7.2" \
          "scikit-learn==1.4.2" "statsmodels==0.13.1" "tqdm==4.60"

    - name: Run tests against minimum dependencies
      run: pytest
